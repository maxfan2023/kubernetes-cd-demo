apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cd-demo-ingress
  namespace: training
  labels:
    app: cd-demo
spec:
  ingressClassName: nginx
  rules:
    - host: cd-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cd-demo-service
                port:
                  number: 80
